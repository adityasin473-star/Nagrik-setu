<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Tickets — Nagrik Setu</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-topbar">
  <a class="brand" href="index.html" style="color:inherit">
    <span class="name" style="font-size:18px">Nagrik Setu</span>
  </a>
  <div class="who">Logged in as <b id="whoName">—</b> · Citizen &nbsp;•&nbsp; <a href="#" id="logoutLink" style="color:#EFC877;">Log out</a></div>
</div>

<div class="app-shell">
  <div class="app-head">
    <div>
      <span class="eyebrow">Your counter</span>
      <h1>My Grievance Tickets</h1>
      <p>File a new complaint or check the status of ones you've already submitted.</p>
    </div>
  </div>

  <div class="stat-row" id="statRow"></div>

  <div class="two-col">
    <div class="panel">
      <h2>File a new grievance</h2>
      <p class="sub">You'll receive a token number the moment you submit.</p>
      <form id="complaintForm">
        <div class="field">
          <label for="category">Category</label>
          <select id="category" required>
            <option value="refund">Consumer Grievance &amp; Refunds</option>
            <option value="road">Public Infrastructure &amp; Road Repair</option>
            <option value="utility">Electricity &amp; Utility Issues</option>
            <option value="water">Municipal Water Supply</option>
            <option value="upi">Digital Payment &amp; Banking</option>
            <option value="cyber">Cyber Crime &amp; Digital Fraud</option>
            <option value="scheme">Scheme &amp; Benefit Discovery</option>
            <option value="health">Public Health &amp; Hospital Guidance</option>
            <option value="education">Student &amp; Education Guidance</option>
            <option value="other">Other Public Service Grievance</option>
          </select>
        </div>
        <div class="field">
          <label for="title">Title</label>
          <input type="text" id="title" required placeholder="Short summary of the issue">
        </div>
        <div class="field">
          <label for="description">Description</label>
          <textarea id="description" required placeholder="Explain what happened, when, and any reference numbers"></textarea>
        </div>
        <div class="field">
          <label for="location">Location</label>
          <input type="text" id="location" required placeholder="Area / sector / city">
        </div>
        <div class="field">
          <label for="priority">Priority</label>
          <select id="priority">
            <option>Low</option>
            <option selected>Medium</option>
            <option>High</option>
          </select>
        </div>
        <div class="form-msg ok" id="msg"></div>
        <div class="field">
          <button class="btn btn-brass btn-block" type="submit">Submit & get token</button>
        </div>
      </form>
    </div>

    <div class="panel">
      <h2>My tickets</h2>
      <p class="sub">Most recent first.</p>
      <div id="ticketList"></div>
    </div>
  </div>
</div>

<script src="js/app.js"></script>
<script>
  const user = requireRole("citizen");

  document.getElementById("logoutLink").addEventListener("click", function (e) {
    e.preventDefault(); logout();
  });

  if (user) {
    document.getElementById("whoName").textContent = user.name;
    renderStats();
    renderTickets();
  }

  function renderStats() {
    const mine = complaintsForUser(user.id);
    const pending = mine.filter(c => c.status === "Pending").length;
    const progress = mine.filter(c => c.status === "In Progress").length;
    const resolved = mine.filter(c => c.status === "Resolved").length;
    const stats = [
      { n: mine.length, l: "Total filed" },
      { n: pending, l: "Pending" },
      { n: progress, l: "In progress" },
      { n: resolved, l: "Resolved" },
    ];
    document.getElementById("statRow").innerHTML = stats.map(s =>
      `<div class="stat-card"><div class="n">${s.n}</div><div class="l">${s.l}</div></div>`
    ).join("");
  }

  function renderTickets() {
    const mine = complaintsForUser(user.id);
    const el = document.getElementById("ticketList");
    if (!mine.length) {
      el.innerHTML = `<div class="empty-note"><div class="big">—</div>No tickets yet. File your first grievance on the left.</div>`;
      return;
    }
    el.innerHTML = mine.map(c => `
      <div class="record">
        <div class="rec-main">
          <div class="rec-top">
            <span class="id">${c.id}</span>
            <span class="cat">${categoryLabel(c.category)}</span>
          </div>
          <h4>${escapeHtml(c.title)}</h4>
          <p>${escapeHtml(c.description)}</p>
          <div class="meta">${escapeHtml(c.location)} · Filed ${fmtDate(c.date)} · Priority: ${c.priority}</div>
        </div>
        <div class="rec-side">
          <span class="stamp ${statusClass(c.status)}">${c.status}</span>
        </div>
      </div>
    `).join("");
  }

  document.getElementById("complaintForm").addEventListener("submit", function (e) {
    e.preventDefault();
    const record = fileComplaint({
      userId: user.id,
      userName: user.name,
      category: document.getElementById("category").value,
      title: document.getElementById("title").value.trim(),
      description: document.getElementById("description").value.trim(),
      location: document.getElementById("location").value.trim(),
      priority: document.getElementById("priority").value,
    });
    const msg = document.getElementById("msg");
    msg.textContent = "Submitted! Your token number is " + record.id + ".";
    msg.className = "form-msg ok show";
    this.reset();
    renderStats();
    renderTickets();
  });

  function escapeHtml(str) {
    const d = document.createElement("div");
    d.textContent = str;
    return d.innerHTML;
  }
</script>
</body>
</html>
