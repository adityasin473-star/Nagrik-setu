<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create account — Nagrik Setu</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="masthead">
  <div class="bar">
    <a class="brand" href="index.html">
      <span class="seal">NS</span>
      <span><span class="name">Nagrik Setu</span><br><span class="tag">Citizen Grievance Token Office</span></span>
    </a>
    <nav><a href="index.html">Home</a></nav>
  </div>
</header>

<div class="auth-wrap">
  <div class="auth-card">
    <span class="eyebrow">New citizen account</span>
    <h1>Register to file a grievance</h1>
    <p class="sub">Takes under a minute. You'll be able to file and track tickets right after.</p>

    <form id="regForm">
      <div class="field">
        <label for="name">Full name</label>
        <input type="text" id="name" required placeholder="Your name">
      </div>
      <div class="field">
        <label for="email">Email address</label>
        <input type="email" id="email" required placeholder="you@example.com">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" required minlength="4" placeholder="At least 4 characters">
      </div>
      <div class="form-msg err" id="msg"></div>
      <div class="field">
        <button class="btn btn-navy btn-block" type="submit">Create account</button>
      </div>
    </form>

    <p class="switch-link">Already registered? <a href="login.html">Log in</a></p>
  </div>
</div>

<script src="js/app.js"></script>
<script>
  document.getElementById("regForm").addEventListener("submit", function (e) {
    e.preventDefault();
    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const msg = document.getElementById("msg");

    const result = registerCitizen({ name, email, password });
    if (!result.ok) {
      msg.textContent = result.message;
      msg.className = "form-msg err show";
      return;
    }
    window.location.href = "dashboard.html";
  });
</script>
</body>
</html>
